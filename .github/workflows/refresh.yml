name: smoke test

# 定时刷新已迁到自建环境（NAS / 网关），因为探活必须走用户自己的网络路径。
# GitHub Actions 跑在美国，探的是「美国 → 源站」，与播放端路径不一致，
# 会大量误判。这里只保留一个手动触发的冒烟测试，不写回仓库。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 语法与拉取检查（不探活、不提交）
        run: |
          python -m py_compile refresh.py
          python refresh.py --no-probe
          echo "--- 产物（仅本 runner 内，不回写）---"
          for f in *.m3u; do
            printf "%-28s %s\n" "$f" "$(grep -c '^#EXTINF' "$f")"
          done
