name: refresh playlists

on:
  schedule:
    # 每天 03:17 UTC（北京 11:17）。避开整点，GitHub cron 高峰会延迟。
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - refresh.py
      - .github/workflows/refresh.yml

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refresh playlists
        run: python refresh.py

      - name: Touch heartbeat
        # 仓库 60 天无活动会停掉 schedule；这个文件保证每天都有一次提交。
        run: date -u +'%Y-%m-%dT%H:%M:%SZ' > .last-refresh

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh $(date -u +%F)"
            git push
          fi
